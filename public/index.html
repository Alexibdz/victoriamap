<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calles de Victoria</title>
  <meta name="description" content="Mapa interactivo de las calles de asfalto y de tierra de Victoria, Entre Ríos.">
  <meta name="theme-color" content="#172033">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Mapa de calles de Victoria"></div>

  <aside class="panel" id="panel">
    <header class="panel-cabecera">
      <div>
        <p class="eyebrow">Victoria · Entre Ríos <span class="marca-edicion">Modo edición</span></p>
        <h1>Calles por tipo de calzada</h1>
      </div>
      <button type="button" class="icono-btn panel-plegar" data-accion="panel"
              aria-expanded="true" aria-controls="panel-cuerpo" title="Plegar panel">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="panel-cuerpo" id="panel-cuerpo">
      <div id="alerta" class="alerta" role="alert" hidden></div>

      <section aria-labelledby="t-buscar">
        <h2 id="t-buscar">Buscar</h2>
        <form id="buscador" class="buscador" role="search" autocomplete="off">
          <input id="busqueda" type="search" list="calles" placeholder="Calle y altura, p. ej. Laprida 450"
                 aria-label="Calle y altura" enterkeyhint="search">
          <button type="submit" class="btn btn-primario" aria-label="Buscar">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <datalist id="calles"></datalist>
        </form>
        <div id="resultado" class="tarjeta resultado" aria-live="polite" hidden></div>
      </section>

      <section aria-labelledby="t-capas">
        <h2 id="t-capas">Capas</h2>
        <div class="capas">
          <label class="capa" data-capa="asfalto">
            <input type="checkbox" role="switch" data-toggle="asfalto" checked>
            <span class="switch" aria-hidden="true"></span>
            <span class="capa-info">
              <span class="capa-nombre"><span class="trazo" aria-hidden="true"></span>Asfalto</span>
              <span class="capa-detalle" data-largo="asfalto">—</span>
            </span>
            <span class="capa-conteo"><span data-conteo="asfalto">—</span><small data-unidad="asfalto">calles</small></span>
            <span class="capa-detalle capa-fuentes" data-fuentes="asfalto"></span>
          </label>

          <label class="capa" data-capa="tierra">
            <input type="checkbox" role="switch" data-toggle="tierra" checked>
            <span class="switch" aria-hidden="true"></span>
            <span class="capa-info">
              <span class="capa-nombre"><span class="trazo" aria-hidden="true"></span>Tierra</span>
              <span class="capa-detalle" data-largo="tierra">—</span>
            </span>
            <span class="capa-conteo"><span data-conteo="tierra">—</span><small data-unidad="tierra">calles</small></span>
            <span class="capa-detalle capa-fuentes" data-fuentes="tierra"></span>
          </label>
        </div>

        <div class="proporcion" aria-hidden="true">
          <span data-barra="asfalto" style="--c: var(--c-asfalto)"></span>
          <span data-barra="tierra" style="--c: var(--c-tierra)"></span>
        </div>
        <div class="proporcion-leyenda">
          <span data-pct="asfalto"></span>
          <span data-pct="tierra"></span>
        </div>
        <p class="total" id="total">Cargando datos…</p>

        <label class="capa capa-pendiente" data-capa="sinclasificar">
          <input type="checkbox" role="switch" data-toggle="sinclasificar" checked>
          <span class="switch" aria-hidden="true"></span>
          <span class="capa-info">
            <span class="capa-nombre"><span class="trazo trazo-punteado" aria-hidden="true"></span>Sin clasificar</span>
            <span class="capa-detalle" data-largo="sinclasificar">—</span>
          </span>
          <span class="capa-conteo"><span data-conteo="sinclasificar">—</span><small data-unidad="sinclasificar">calles</small></span>
          <span class="capa-detalle capa-fuentes">Cuadras que existen en OpenStreetMap pero no se relevaron.</span>
        </label>
      </section>

      <section id="seccion-seleccion" aria-labelledby="t-seleccion" hidden>
        <div class="seccion-cabecera">
          <h2 id="t-seleccion">Selección</h2>
          <label class="mini-switch" title="Cada clic suma o quita tramos de la selección">
            <input type="checkbox" id="multiple"> Varias
          </label>
        </div>
        <div id="seleccion" class="tarjeta" aria-live="polite"></div>
      </section>

      <section id="seccion-cambios" aria-labelledby="t-cambios" hidden>
        <h2 id="t-cambios">Cambios</h2>
        <div id="cambios" class="tarjeta"></div>
        <div class="descargas">
          <button type="button" class="btn" data-accion="descargar" data-capa="asfalto">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v10m0 0l-4-4m4 4l4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            asfalto.geojson
          </button>
          <button type="button" class="btn" data-accion="descargar" data-capa="tierra">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v10m0 0l-4-4m4 4l4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            tierra.geojson
          </button>
        </div>
      </section>

      <footer class="pie">
        <div class="leyenda">
          <span><svg viewBox="0 0 28 8" width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="26" y2="4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Verificada</span>
          <span><svg viewBox="0 0 28 8" width="28" height="8" aria-hidden="true"><line x1="1" y1="4" x2="27" y2="4" stroke="currentColor" stroke-width="3" stroke-dasharray="5 4"/></svg>Satelital</span>
        </div>
        <div class="opciones">
          <label class="mini-switch">
            <input type="checkbox" id="nombres" checked> Nombres de calles
          </label>
        </div>
        <div class="fondo">
          <span>Fondo</span>
          <div class="segmentado" role="group" aria-label="Mapa de fondo">
            <button type="button" data-accion="fondo" data-fondo="mapa" aria-pressed="true">Gris</button>
            <button type="button" data-accion="fondo" data-fondo="color" aria-pressed="false">Color</button>
            <button type="button" data-accion="fondo" data-fondo="satelite" aria-pressed="false">Satélite</button>
          </div>
        </div>
      </footer>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="sin-js">Este mapa necesita JavaScript para funcionar.</p></noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
